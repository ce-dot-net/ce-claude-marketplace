name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.9 = stock macOS /usr/bin/python3 (DESIGN §0 floor); 3.12 = current.
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest (the plugin itself is stdlib-only)
        run: python -m pip install --upgrade pip pytest
      - name: Unit + integration suite (hermetic, fake ace-cli via tests/conftest.py)
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Plugin-local tests
        run: python -m pytest plugins/ace/tests -q -p no:cacheprovider
      - name: Hook e2e (v8 target behavior)
        env:
          ACE_E2E: "1"
        run: python -m pytest tests/e2e -q -p no:cacheprovider
      - name: claude plugin validate (skipped when the claude CLI is unavailable)
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate plugins/ace --strict
          else
            echo "claude CLI not installed on this runner; skipping plugin validate"
          fi
