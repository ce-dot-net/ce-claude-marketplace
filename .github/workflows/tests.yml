name: tests

on:
  push:
    branches: [main, v8-modernize]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        # 8.1.0: the Python hook chain supports >= 3.10 (the floor) up to the latest stable (3.15).
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"  # the mod test harness needs --experimental-strip-types (node >= 22.6)
      - name: Install pytest + rstest (the plugin itself is stdlib-only; rstest is the pinned parallel runner)
        run: python -m pip install --upgrade pip pytest rstest==0.10.0
      - name: The hook code compiles on the floor (3.10 job)
        if: matrix.python == '3.10'
        run: python -m py_compile $(find plugins/ace/shared-hooks plugins/ace/utils -name '*.py')
      # The hermetic suites run BEFORE the plugin dependencies exist: with plugins/ace/node_modules present the
      # hooks under test would resolve the real plugin-local CLI instead of the fake one.
      - name: Unit + integration suite (hermetic, fake ace-cli via tests/conftest.py)
        run: rstest tests -q -p no:cacheprovider
      - name: Plugin-local tests
        run: rstest plugins/ace/tests -q -p no:cacheprovider
      - name: Pinned ace-cli (what Claude Code installs on plugin install/update)
        working-directory: plugins/ace
        run: |
          npm ci --ignore-scripts
          npm rebuild better-sqlite3
      # 8.1.4: e2e AFTER the pinned install: the trace delivery e2e runs the real plugin-local @ace-sdk/core against the
      # fake server (tests copy the plugin, so the hooks stay hermetic). ACE_REQUIRE_REALCORE turns a skip into a failure.
      - name: Hook e2e (v8 target behavior, real pinned core)
        env:
          ACE_E2E: "1"
          ACE_REQUIRE_REALCORE: "1"
        run: rstest tests/e2e -q -p no:cacheprovider -n 4  # real node + fake servers: 4 workers on 3-core runners
      - name: CLI contract test (every flag and field the plugin uses, against the pinned CLI)
        run: rstest tests/test_cli_contract.py -q -p no:cacheprovider
      - name: claude plugin validate --strict (Claude Code floor)
        run: |
          npm i -g @anthropic-ai/claude-code@2.1.311
          claude plugin validate plugins/ace --strict
      - name: Mod tests (claude plugin test)
        run: claude plugin test plugins/ace
