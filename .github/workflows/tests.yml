name: tests

on:
  push:
    branches: [main, v8-modernize]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.9 = stock macOS /usr/bin/python3 (DESIGN §0 floor); 3.12 = current.
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
      - name: Install pytest (the plugin itself is stdlib-only)
        run: python -m pip install --upgrade pip pytest
      # The hermetic suites run BEFORE the plugin dependencies exist: with plugins/ace/node_modules present the
      # hooks under test would resolve the real plugin-local CLI instead of the fake one.
      - name: Unit + integration suite (hermetic, fake ace-cli via tests/conftest.py)
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Plugin-local tests
        run: python -m pytest plugins/ace/tests -q -p no:cacheprovider
      - name: Hook e2e (v8 target behavior)
        env:
          ACE_E2E: "1"
        run: python -m pytest tests/e2e -q -p no:cacheprovider
      - name: Pinned ace-cli (what Claude Code installs on plugin install/update)
        working-directory: plugins/ace
        run: |
          npm ci --ignore-scripts
          npm rebuild better-sqlite3
      - name: CLI contract test (every flag and field the plugin uses, against the pinned CLI)
        run: python -m pytest tests/test_cli_contract.py -q -p no:cacheprovider
      - name: claude plugin validate --strict (Claude Code floor)
        run: |
          npm i -g @anthropic-ai/claude-code@2.1.311
          claude plugin validate plugins/ace --strict
